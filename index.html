<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr_2806 | Expert en Cybersécurité & Développement Sécurisé</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #3b82f6;
            --accent: #00ff88;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --lighter: #ffffff;
            --gray: #94a3b8;
            --dark-gray: #475569;
            --gradient: linear-gradient(135deg, var(--primary), var(--accent));
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Mode clair */
        body.light-mode {
            --dark: #f8fafc;
            --darker: #e2e8f0;
            --light: #0f172a;
            --lighter: #020617;
            --gray: #475569;
            --dark-gray: #94a3b8;
        }
        
        /* Typographie améliorée */
        h1, h2, h3, h4 {
            color: var(--light);
            font-weight: 800;
            line-height: 1.1;
        }
        
        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        h2 {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            margin-bottom: 15px;
            color: var(--light);
        }
        
        h2 span {
            color: var(--primary);
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        p {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 600px;
            line-height: 1.8;
        }
        
        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: var(--accent);
        }
        
        /* Layout amélioré */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        section {
            padding: 120px 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
            width: 100%;
        }
        
        .section-header h2 {
            white-space: nowrap;
            margin-right: 20px;
        }
        
        .section-header .line {
            height: 1px;
            width: 100%;
            background: var(--gradient);
            position: relative;
            top: -5px;
        }
        
        /* Navigation améliorée */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            box-shadow: 0 5px 20px -5px rgba(2, 6, 23, 0.3);
        }
        
        nav.scrolled {
            padding: 15px 50px;
            box-shadow: 0 10px 30px -10px rgba(2, 6, 23, 0.7);
        }
        
        .logo {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: translateY(-2px);
            text-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }
        
        .logo img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
        }
        
        .logo:hover img {
            transform: rotate(15deg);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-left: 30px;
        }
        
        .nav-links a {
            color: var(--light);
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 0;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        .nav-links a:hover::before {
            width: 100%;
        }
        
        .nav-links a span {
            color: var(--primary);
            margin-right: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
        }
        
        .menu-btn {
            display: none;
            cursor: pointer;
            z-index: 1001;
            width: 30px;
            height: 20px;
            position: relative;
        }
        
        .menu-btn__burger {
            position: absolute;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .menu-btn__burger::before,
        .menu-btn__burger::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .menu-btn__burger::before {
            transform: translateY(-8px);
        }
        
        .menu-btn__burger::after {
            transform: translateY(8px);
        }
        
        .menu-btn.open .menu-btn__burger {
            background: transparent;
        }
        
        .menu-btn.open .menu-btn__burger::before {
            transform: rotate(45deg);
        }
        
        .menu-btn.open .menu-btn__burger::after {
            transform: rotate(-45deg);
        }

        /* Theme Toggle */
        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 20px;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(30deg) scale(1.1);
            color: var(--accent);
        }

        /* Search */
        .search-container {
            position: relative;
            margin-left: 20px;
            display: flex;
            align-items: center;
        }

        #search-input {
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid var(--dark-gray);
            background: rgba(30, 41, 59, 0.5);
            color: var(--light);
            width: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .search-container.active #search-input {
            width: 200px;
            opacity: 1;
            margin-right: 10px;
        }

        #search-btn {
            background: transparent;
            border: none;
            color: var(--light);
            cursor: pointer;
            font-size: 1rem;
        }

        .search-results {
            position: absolute;
            top: 100%;
            right: 0;
            width: 300px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--darker);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 10px;
            display: none;
            z-index: 1000;
        }

        .search-result {
            display: block;
            padding: 10px;
            color: var(--light);
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .search-result:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .search-result h5 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .search-result p {
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        /* Hero Section améliorée */
        #hero {
            position: relative;
            overflow: hidden;
            padding-top: 100px;
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }
        
        .hero-subtitle {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-family: 'Fira Code', monospace;
            display: inline-block;
            animation: fadeInDown 1s ease;
        }
        
        .hero-desc {
            font-size: 1.3rem;
            max-width: 600px;
            margin-bottom: 30px;
            color: var(--light);
            animation: fadeIn 1.5s ease;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--primary);
            padding: 18px 30px;
            border: 1px solid var(--primary);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            margin-right: 20px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: var(--gradient);
            z-index: -1;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        .btn:hover::before {
            width: 100%;
        }
        
        .btn:hover {
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px -10px rgba(37, 99, 235, 0.4);
            border-color: transparent;
        }
        
        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        .btn-primary {
            background: var(--gradient);
            color: white;
            border: none;
            animation: pulse 2s infinite;
        }
        
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px -10px rgba(0, 255, 136, 0.4);
            animation: none;
        }
        
        .btn-secondary {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        .btn-secondary:hover {
            background: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 15px 25px -15px rgba(37, 99, 235, 0.4);
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        /* Flèche animée */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--light);
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            cursor: pointer;
            z-index: 10;
        }
        
        /* About Section améliorée */
        #about {
            position: relative;
            background-color: var(--darker);
            overflow: hidden;
        }
        
        #about::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
            z-index: 0;
        }
        
        .about-content {
            display: flex;
            align-items: flex-start;
            gap: 50px;
            position: relative;
            z-index: 1;
        }
        
        .about-img-container {
            position: relative;
            width: 350px;
            flex-shrink: 0;
            perspective: 1000px;
        }
        
        .about-img {
            width: 100%;
            height: 350px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }
        
        .about-img:hover {
            transform: rotateY(10deg) rotateX(5deg) scale(1.05);
            box-shadow: 0 30px 60px -15px rgba(37, 99, 235, 0.3);
        }
        
        .about-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            transition: all 0.5s ease;
        }
        
        .about-img:hover img {
            transform: scale(1.1);
        }
        
        .about-text {
            flex: 1;
        }
        
        .about-text p {
            margin-bottom: 20px;
            animation: fadeIn 1s ease;
        }
        
        .skills-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(140px, 200px));
            gap: 10px 20px;
            margin-top: 20px;
        }
        
        .skills-list li {
            position: relative;
            padding-left: 25px;
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }
        
        .skills-list li:hover {
            color: var(--light);
            transform: translateX(5px);
        }
        
        .skills-list li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Skills Bars */
        .skills-bars {
            margin-top: 40px;
        }

        .skill {
            margin-bottom: 20px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .skill-info span:first-child {
            color: var(--light);
            font-weight: 500;
        }

        .skill-info span:last-child {
            color: var(--primary);
            font-family: 'Fira Code', monospace;
        }

        .skill-bar {
            height: 8px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: var(--gradient);
            border-radius: 10px;
            width: 0;
        }
        
        /* CV Section */
#cv {
    background-color: var(--darker);
    position: relative;
    overflow: hidden;
}

.cv-viewer {
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

.cv-viewer iframe {
    flex: 2;

.cv-skills {

    margin-bottom: 20px;

    list-style: none;

        /* Timeline améliorée */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 40px auto;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            width: 4px;
            background: var(--gradient);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
        }
        
        .timeline-item {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .timeline-item:nth-child(odd) {
            left: 0;
        }
        
        .timeline-item:nth-child(even) {
            left: 50%;
        }
        
        .timeline-content {
            padding: 25px;
            background-color: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.1);
        }
        
        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(37, 99, 235, 0.3);
            border-color: var(--primary);
        }
        
        .timeline-date {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 10px;
            font-family: 'Fira Code', monospace;
        }
        
        .timeline-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--light);
        }
        
        .timeline-desc {
            color: var(--gray);
            font-size: 0.95rem;
        }
        
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
